---
services:
  db:
    image: perurilahari/python-project2:database-image
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    volumes:
      - myapp:/var/lib/mysql/

  auth_service:
    image: perurilahari/python-project2:auth-image
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: perurilahari/python-project2:book-image
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: perurilahari/python-project2:borrow-image
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: perurilahari/python-project2:app-image
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: bridge
volumes:
  myapp:
